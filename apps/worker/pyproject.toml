[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "one-radar-worker"
version = "0.1.0"
description = "Worker skeleton for OneRadar ingestion and processing pipelines"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OneRadar" }]
dependencies = [
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "trafilatura>=2.0.0",
  "readability-lxml>=0.8.1",
  "wechat-article-parser==0.0.3",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
one-radar-worker = "one_radar_worker.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
