services:
  postgres:
    image: postgres:16
    container_name: oneradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ONERADAR_POSTGRES_DB:-oneradar}
      POSTGRES_USER: ${ONERADAR_POSTGRES_USER:-oneradar}
      POSTGRES_PASSWORD: ${ONERADAR_POSTGRES_PASSWORD:-oneradar}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: oneradar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: oneradar-api
    restart: unless-stopped
    env_file:
      - ../../.env.example
    environment:
      ONERADAR_DATABASE_URL: ${ONERADAR_DATABASE_URL:-postgresql+psycopg://oneradar:oneradar@postgres:5432/oneradar}
      ONERADAR_REDIS_URL: ${ONERADAR_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/app/data

  worker:
    build:
      context: ../../
      dockerfile: apps/worker/Dockerfile
    container_name: oneradar-worker
    restart: unless-stopped
    env_file:
      - ../../.env.example
    environment:
      ONERADAR_DATABASE_URL: ${ONERADAR_DATABASE_URL:-postgresql+psycopg://oneradar:oneradar@postgres:5432/oneradar}
      ONERADAR_REDIS_URL: ${ONERADAR_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
      - redis
    volumes:
      - ../../data:/app/data

volumes:
  postgres_data:
